  /api/v1/audit/export-batches/:
    get:
      operationId: api_v1_audit_export_batches_list
      parameters:
      - in: query
        name: company_scope_reference
        schema:
          type: string
          format: uuid
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: file_direction
        schema:
          type: string
          enum:
          - downloaded
          - generated
          - uploaded
        description: |-
          * `uploaded` - Uploaded (external → CIXCI)
          * `generated` - Generated (CIXCI-created)
          * `downloaded` - Downloaded (CIXCI → external)
      - in: query
        name: file_lifecycle_status
        schema:
          type: string
          enum:
          - archived
          - canceled
          - duplicate_detected
          - expired
          - generated
          - partially_processed
          - processed
          - processing
          - processing_failed
          - queued_for_validation
          - received
          - replaced
          - stored
          - superseded
          - validating
          - validation_failed
          - validation_passed
        description: |-
          * `received` - Received
          * `generated` - Generated
          * `stored` - Stored
          * `queued_for_validation` - Queued for Validation
          * `validating` - Validating
          * `validation_failed` - Validation Failed
          * `validation_passed` - Validation Passed
          * `processing` - Processing
          * `processing_failed` - Processing Failed
          * `processed` - Processed
          * `partially_processed` - Partially Processed
          * `duplicate_detected` - Duplicate Detected
          * `superseded` - Superseded
          * `replaced` - Replaced
          * `canceled` - Canceled
          * `expired` - Expired
          * `archived` - Archived
      - in: query
        name: file_purpose
        schema:
          type: string
          enum:
          - audit_export
          - invoice_export
          - media_upload
          - product_export
          - product_import
          - report_export
          - unknown_other
          - vendor_delivery_import
          - vendor_order_export
          - vendor_return_export
          - vendor_return_import
          - vendor_shipping_import
        description: |-
          * `product_import` - Product Import
          * `product_export` - Product Export
          * `vendor_order_export` - Vendor Order Export
          * `vendor_return_export` - Vendor Return Export
          * `vendor_shipping_import` - Vendor Shipping Import
          * `vendor_delivery_import` - Vendor Delivery Import
          * `vendor_return_import` - Vendor Return Import
          * `media_upload` - Media Upload
          * `invoice_export` - Invoice Export
          * `report_export` - Report Export
          * `audit_export` - Audit Export
          * `unknown_other` - Unknown / Other
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
