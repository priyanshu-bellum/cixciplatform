  /api/v1/catalog/products/:
    get:
      operationId: api_v1_catalog_products_list
      description: |-
        Mixin that enforces check_access() before allowing any action.

        Subclasses define `required_capability` (str) or
        `action_capability_map` (dict mapping action name → capability_code).
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: product_category
        schema:
          type: string
          nullable: true
          enum:
          - Cases
          - Chargers and Cables
          - Headphones
          - Memory
          - Phone Attachments
          - Screen Protection
          - Speakers
          - Wearable Tech
        description: |-
          * `Cases` - Cases
          * `Screen Protection` - Screen Protection
          * `Headphones` - Headphones
          * `Speakers` - Speakers
          * `Chargers and Cables` - Chargers and Cables
          * `Memory` - Memory
          * `Wearable Tech` - Wearable Tech
          * `Phone Attachments` - Phone Attachments
      - in: query
        name: product_type
        schema:
          type: string
          enum:
          - accessory
          - branded_merchandise
          - device
        description: |-
          * `accessory` - Accessory
          * `branded_merchandise` - Branded Merchandise
          * `device` - Device (reference only)
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: selling_status
        schema:
          type: string
          enum:
          - for_sale
          - not_for_sale
          - stop_selling
        description: |-
          * `not_for_sale` - Not For Sale
          * `for_sale` - For Sale
          * `stop_selling` - Stop Selling
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - archived
          - draft
          - eol
          - inactive
          - out_of_stock
          - pending_review
        description: |-
          * `draft` - Draft
          * `pending_review` - Pending Review
          * `active` - Active
          * `inactive` - Inactive
          * `archived` - Archived
          * `eol` - EOL
          * `out_of_stock` - Out of Stock
      - in: query
        name: vendor_company_reference
        schema:
          type: string
          format: uuid
