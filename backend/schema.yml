  /api/v1/pricing/buyer-prices/:
    get:
      operationId: v1_pricing_buyer_prices_list
      description: |-
        Prices a buyer is allowed to see.

        A price is visible to a buyer only when a
        BuyerFacingPricingVisibilityEvidence row grants visibility for that
        buyer's company and channel. There is no fallback to catalog pricing — if
        the evidence is missing the buyer simply does not see the price.

        Only buyer-safe fields are exposed (no vendor wholesale price, no
        commission, no markup).
      parameters:
      - in: query
        name: channel
        schema:
          type: string
          enum:
          - bulk_po
          - buyer_contract
          - buyer_storefront
          - marketplace
          - online_dtc
          - owned_channel
          - promotional
          - retail_pos
        description: |-
          * `online_dtc` - Online / Direct-to-Consumer
          * `bulk_po` - Bulk Purchase Order
          * `owned_channel` - Owned Channel / Kaseory
          * `buyer_storefront` - Buyer Storefront
          * `marketplace` - Marketplace (placeholder)
          * `retail_pos` - Retail POS (placeholder)
          * `promotional` - Promotional Campaign (placeholder)
          * `buyer_contract` - Buyer-Specific Contract (placeholder)
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: product_reference
        schema:
          type: string
          format: uuid
      tags:
      - v1
      security:
      - cookieAuth: []
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBuyerFacingPriceList'
          description: ''
