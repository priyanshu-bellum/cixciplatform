components:
  schemas:
    AccessClassEnum:
      enum:
      - public_metadata
      - buyer_visible
      - vendor_visible
      - internal_operations
      - system_admin_only
      - compliance_only
      type: string
      description: |-
        * `public_metadata` - Public Metadata
        * `buyer_visible` - Buyer Visible
        * `vendor_visible` - Vendor Visible
        * `internal_operations` - Internal Operations
        * `system_admin_only` - System Admin Only
        * `compliance_only` - Compliance Only
    ActionEnum:
      enum:
      - region_activated
      - region_deactivated
      type: string
      description: |-
        * `region_activated` - Region Activated
        * `region_deactivated` - Region Deactivated
    ActionTypeEnum:
      enum:
      - ORIGINAL_EXPORT
      - REEXPORT
      - AUTOMATIC_RETRY
      - MANUAL_RETRY
      - DOWNLOAD
      type: string
      description: |-
        * `ORIGINAL_EXPORT` - ORIGINAL_EXPORT
        * `REEXPORT` - REEXPORT
        * `AUTOMATIC_RETRY` - AUTOMATIC_RETRY
        * `MANUAL_RETRY` - MANUAL_RETRY
        * `DOWNLOAD` - DOWNLOAD
    ActivitySummaryConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/ActivitySummaryConfigStatusEnum'
        delivery_times:
          description: List of HH:MM times in schedule_timezone
        schedule_timezone:
          type: string
          maxLength: 50
        skip_weekends:
          type: boolean
        skip_holidays:
          type: boolean
