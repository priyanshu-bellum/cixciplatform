components:
  schemas:
    AccessClassEnum:
      enum:
      - public_metadata
      - buyer_visible
      - vendor_visible
      - internal_operations
      - system_admin_only
      - compliance_only
      type: string
      description: |-
        * `public_metadata` - Public Metadata
        * `buyer_visible` - Buyer Visible
        * `vendor_visible` - Vendor Visible
        * `internal_operations` - Internal Operations
        * `system_admin_only` - System Admin Only
        * `compliance_only` - Compliance Only
    ActionTypeEnum:
      enum:
      - ORIGINAL_EXPORT
      - REEXPORT
      - AUTOMATIC_RETRY
      - MANUAL_RETRY
      - DOWNLOAD
      type: string
      description: |-
        * `ORIGINAL_EXPORT` - ORIGINAL_EXPORT
        * `REEXPORT` - REEXPORT
        * `AUTOMATIC_RETRY` - AUTOMATIC_RETRY
        * `MANUAL_RETRY` - MANUAL_RETRY
        * `DOWNLOAD` - DOWNLOAD
    ActivitySummaryConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/ActivitySummaryConfigStatusEnum'
        delivery_times:
          description: List of HH:MM times in schedule_timezone
        schedule_timezone:
          type: string
          maxLength: 50
        skip_weekends:
          type: boolean
        skip_holidays:
          type: boolean
        explicit_recipient_ids: {}
        last_successful_summary_cursor_reference:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - delivery_times
      - id
      - last_successful_summary_cursor_reference
    ActivitySummaryConfigRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ActivitySummaryConfigStatusEnum'
        delivery_times:
          description: List of HH:MM times in schedule_timezone
        schedule_timezone:
          type: string
          minLength: 1
          maxLength: 50
        skip_weekends:
          type: boolean
        skip_holidays:
          type: boolean
        explicit_recipient_ids: {}
      required:
      - delivery_times
    ActivitySummaryConfigStatusEnum:
      enum:
      - active
      - paused
      - retired
      type: string
      description: |-
        * `active` - Active
        * `paused` - Paused
        * `retired` - Retired
    ActivitySummaryWindow:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ActivitySummaryWindowStatusEnum'
        effective_start:
          type: string
          format: date-time
          description: Earliest start of this + all subsumed windows
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - effective_start
      - id
      - window_end
      - window_start
    ActivitySummaryWindowStatusEnum:
      enum:
      - active
      - delivery_failed
      - superseded
      - suppressed_no_activity
      type: string
      description: |-
        * `active` - Active
        * `delivery_failed` - Delivery Failed
        * `superseded` - Superseded
        * `suppressed_no_activity` - Suppressed (No Activity)
    AssetTypeEnum:
      enum:
      - product_image
      - device_image
      - brand_logo
      - document
      - video
      - other
      type: string
      description: |-
        * `product_image` - Product Image
        * `device_image` - Device Image
        * `brand_logo` - Brand Logo
        * `document` - Document
        * `video` - Video (placeholder)
        * `other` - Other
    AuditRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_code:
          type: string
          maxLength: 200
        event_description:
          type: string
        status:
          type: string
          maxLength: 50
        actor_reference:
          type: string
          format: uuid
          nullable: true
          description: Human user ID
        service_trigger_reference:
          type: string
          description: Non-human service identity (scheduler, webhook handler, celery
            task)
          maxLength: 200
        company_scope_reference:
          type: string
          format: uuid
          description: Tenant Company scope — REQUIRED
        source_module:
          type: string
          maxLength: 100
        source_record_type:
          type: string
          maxLength: 150
        source_record_id:
          type: string
          format: uuid
          nullable: true
        evidence_record_reference:
          type: string
          format: uuid
          nullable: true
        correlation_id:
          type: string
          format: uuid
          nullable: true
        idempotency_key:
          type: string
          maxLength: 255
        error_code:
          type: string
          maxLength: 100
        error_message:
          type: string
        retry_count:
          type: integer
          maximum: 32767
          minimum: 0
        retention_class:
          $ref: '#/components/schemas/RetentionClassEnum'
        redaction_class:
          $ref: '#/components/schemas/RedactionClassEnum'
        access_class:
          $ref: '#/components/schemas/AccessClassEnum'
        created_at:
          type: string
          format: date-time
      required:
      - company_scope_reference
      - event_code
      - id
      - status
    BindabilityStatusEnum:
      enum:
      - order_bindable
      - procurement_bindable
