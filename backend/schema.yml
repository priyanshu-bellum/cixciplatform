openapi: 3.0.3
info:
  title: CIXCI Platform API
  version: 1.0.0
  description: CIXCI B2B Accessory Commerce Platform
paths:
  /api/v1/analytics/metrics/:
    get:
      operationId: api_v1_analytics_metrics_list
      description: |-
        Mixin that enforces check_access() before allowing any action.

        Subclasses define `required_capability` (str) or
        `action_capability_map` (dict mapping action name → capability_code).
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReportingMetricList'
          description: ''
    post:
      operationId: api_v1_analytics_metrics_create
      description: |-
        Mixin that enforces check_access() before allowing any action.

        Subclasses define `required_capability` (str) or
        `action_capability_map` (dict mapping action name → capability_code).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportingMetricRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportingMetricRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportingMetricRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportingMetric'
          description: ''
