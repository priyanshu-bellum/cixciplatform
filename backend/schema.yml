          $ref: '#/components/schemas/Channel71eEnum'
        event_type:
          type: string
          minLength: 1
          description: Source event that triggers this template
          maxLength: 200
        subject_template:
          type: string
          maxLength: 500
        body_template:
          type: string
          minLength: 1
        dynamic_fields:
          description: Safe field names allowed in template rendering
        status:
          $ref: '#/components/schemas/NotificationTemplateStatusEnum'
        locale:
          type: string
          minLength: 1
          maxLength: 10
        company_scope:
          type: string
          format: uuid
          nullable: true
          description: Null = platform-wide template
        effective_from:
          type: string
          format: date-time
      required:
      - body_template
      - channel
      - event_type
      - template_code
    NotificationTemplateStatusEnum:
      enum:
