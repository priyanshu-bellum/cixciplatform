  /api/v1/catalog/products/:
    get:
      operationId: v1_catalog_products_list
      description: |-
        Paginated product list.

        The page of products is resolved first, then the related rows needed
        for serialization are loaded in bulk (see _build_bulk_context) so the
        response cost is proportional to the page size, not to the catalog size.
      parameters:
      - in: query
        name: brand
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: color
        schema:
          type: array
          items:
            type: string
            nullable: true
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: has_map_price
        schema:
          type: boolean
      - in: query
        name: has_wholesale_price
        schema:
          type: boolean
      - in: query
        name: msrp_range
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: product_category
        schema:
          type: array
          items:
            type: string
            nullable: true
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: product_ids
        schema:
          type: string
      - in: query
        name: product_type
        schema:
          type: string
          enum:
          - accessory
          - branded_merchandise
          - device
        description: |-
          * `accessory` - Accessory
          * `branded_merchandise` - Branded Merchandise
          * `device` - Device (reference only)
      - in: query
        name: projection_scope
        schema:
          type: boolean
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: selling_status
        schema:
          type: string
          enum:
          - for_sale
          - not_for_sale
          - stop_selling
        description: |-
          * `not_for_sale` - Not For Sale
          * `for_sale` - For Sale
          * `stop_selling` - Stop Selling
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - archived
          - draft
          - eol
          - inactive
          - out_of_stock
          - pending_review
        description: |-
          * `draft` - Draft
          * `pending_review` - Pending Review
          * `active` - Active
          * `inactive` - Inactive
          * `archived` - Archived
          * `eol` - EOL
          * `out_of_stock` - Out of Stock
      - in: query
        name: vendor_company_reference
        schema:
          type: string
          format: uuid
      - in: query
        name: vendor_name
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
    post:
      operationId: v1_catalog_products_create
      description: |-
        Mixin that enforces check_access() before allowing any action.

        Subclasses define `required_capability` (str) or
        `action_capability_map` (dict mapping action name → capability_code).
      tags:
      - v1
