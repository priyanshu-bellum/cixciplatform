        schema:
          type: string
          format: uuid
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - acknowledged
          - dispatched
          - eligible
          - failed
          - held
          - pending
        description: |-
          * `pending` - Pending
          * `held` - Held (awaiting all vendors)
