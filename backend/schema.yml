  /api/v1/analytics/freshness-markers/:
    get:
      operationId: v1_analytics_freshness_markers_list
      description: |-
        Mixin that enforces check_access() before allowing any action.

        Subclasses define `required_capability` (str) or
        `action_capability_map` (dict mapping action name → capability_code).
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: is_stale
        schema:
          type: boolean
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: source_module
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      - ApiKeyAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDataFreshnessMarkerList'
          description: ''
