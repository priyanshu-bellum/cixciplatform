version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: cixci_redis_${ENV_NAME}
    ports:
      - "${REDIS_PORT}:6379"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cixci_backend_${ENV_NAME}
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --timeout-keep-alive 65
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - FRONTEND_URL=${FRONTEND_URL}
      - USE_GCS=${USE_GCS}
      - GS_BUCKET_NAME=${GS_BUCKET_NAME}
      - MEDIA_USE_SHORT_URLS=${MEDIA_USE_SHORT_URLS:-False}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
      - MEDIA_URL=${MEDIA_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@cixci.com}
      - VENDOR_CATALOG_ENCRYPTION_KEYS=${VENDOR_CATALOG_ENCRYPTION_KEYS:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - redis
    restart: always

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cixci_celery_${ENV_NAME}
    command: celery -A config worker -l info -Q celery,vendor_catalog,vendor_commerce
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - FRONTEND_URL=${FRONTEND_URL}
      - MEDIA_USE_SHORT_URLS=${MEDIA_USE_SHORT_URLS:-False}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
      - MEDIA_URL=${MEDIA_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@cixci.com}
      - VENDOR_CATALOG_ENCRYPTION_KEYS=${VENDOR_CATALOG_ENCRYPTION_KEYS:-}
    depends_on:
      - redis
    restart: always

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cixci_beat_${ENV_NAME}
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - VENDOR_CATALOG_ENCRYPTION_KEYS=${VENDOR_CATALOG_ENCRYPTION_KEYS:-}
    depends_on:
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: cixci_frontend_${ENV_NAME}
    ports:
      - "${FRONTEND_PORT}:80"
    restart: always
